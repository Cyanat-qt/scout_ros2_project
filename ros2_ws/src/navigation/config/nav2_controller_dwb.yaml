controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 12.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.4
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.08
      movement_time_allowance: 20.0

    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.18
      yaw_goal_tolerance: 3.14

    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: -0.12
      min_vel_y: -0.18
      max_vel_x: 0.35
      max_vel_y: 0.18
      max_vel_theta: 1.4
      min_speed_xy: 0.0
      max_speed_xy: 0.35
      min_speed_theta: 0.0
      acc_lim_x: 1.8
      acc_lim_y: 1.2
      acc_lim_theta: 2.5
      decel_lim_x: -2.0
      decel_lim_y: -1.5
      decel_lim_theta: -2.5
      vx_samples: 16
      vy_samples: 7
      vtheta_samples: 20
      sim_time: 1.6
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.18
      yaw_goal_tolerance: 1.57
      trans_stopped_velocity: 0.08
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, BaseObstacle, PathDist, GoalDist]
      BaseObstacle.scale: 0.08
      PathAlign.scale: 4.0
      PathAlign.forward_point_distance: 0.18
      GoalAlign.scale: 3.0
      GoalAlign.forward_point_distance: 0.18
      PathDist.scale: 28.0
      GoalDist.scale: 22.0
      RotateToGoal.scale: 2.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

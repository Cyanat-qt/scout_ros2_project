controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 3.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 20.0

    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.18
      yaw_goal_tolerance: 3.14

    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 24
      model_dt: 0.05
      batch_size: 1800
      iteration_count: 1
      vx_std: 0.18
      vy_std: 0.16
      wz_std: 0.55
      vx_max: 0.45
      vx_min: -0.08
      vy_max: 0.27
      wz_max: 1.80
      ax_max: 1.6
      ax_min: -1.6
      ay_max: 1.2
      ay_min: -1.2
      az_max: 2.5
      temperature: 0.30
      gamma: 0.015
      motion_model: Omni
      visualize: false
      regenerate_noises: false
      retry_attempt_limit: 2
      prune_distance: 1.2
      transform_tolerance: 0.2

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathAngleCritic
        - PathFollowCritic
        - TwirlingCritic

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.8
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.5
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.08
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 12
        use_path_orientations: false
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.5
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.2
        mode: 0
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.0
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
